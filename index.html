<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Strategic end-user facility locations">
  <title>Strategic Facility Locations | Regal Rexnord</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-title">
      <h1>Strategic End User Accounts – Facility Locations</h1>
      <p id="headerSummary">Strategic facilities across mapped countries</p>
    </div>
    <div class="brand" aria-label="Regal Rexnord">
      <span class="brand-mark" aria-hidden="true">RR</span>
      <span class="brand-name">Regal<span>Rexnord</span></span>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar" aria-label="Map controls">
      <section class="accounts" aria-labelledby="accountsHeading">
        <div class="section-heading">
          <h2 id="accountsHeading">Account legend</h2>
        </div>
        <h3 id="legendVertical">All Strategic Accounts</h3>
        <p class="legend-summary"><span id="accountCount"></span> &nbsp;|&nbsp; <span id="legendFacilityCount"></span></p>
        <div id="accountLegend" class="account-list"></div>
        <button id="clearFilters" class="clear-filter" type="button">↻ Clear All Filters</button>
      </section>
    </aside>

    <section class="map-panel" aria-label="Facility map">
      <section class="filters" aria-labelledby="filtersHeading">
        <h2 id="filtersHeading">⚑ &nbsp; Filters</h2>
        <label><span>Vertical</span><select id="verticalFilter" aria-label="Vertical"><option value="">All Verticals</option></select></label>
        <label><span>Ultimate Parent</span><select id="parentFilter" aria-label="Ultimate Parent"><option value="">All Parents</option></select></label>
        <label><span>Operating Entity</span><select id="entityFilter" aria-label="Operating or Bottler Entity"><option value="">All Operating Entities</option></select></label>
        <label><span>Facility Type</span><select id="typeFilter" aria-label="Facility Type"><option value="">All Facility Types</option></select></label>
        <label><span>Country</span><select id="countryFilter" aria-label="Country"><option value="">All Countries</option></select></label>
        <label><span>ACE</span><select id="aceFilter" aria-label="ACE"><option value="">All ACEs</option></select></label>
        <button id="resetFilters" class="reset-button" type="button">Reset</button>
        <span id="activeFilterCount" class="sr-only">All records</span>
      </section>
      <div id="map" role="application" aria-label="Interactive map of mapped strategic facilities"></div>
      <div id="mapStatus" class="map-status" aria-live="polite">Loading facilities…</div>
      <section class="kpis" aria-label="Live totals">
        <div><strong id="kpiFacilities">—</strong><span>Filtered Facilities</span></div>
        <div><strong id="kpiAccounts">—</strong><span>Strategic Accounts</span></div>
        <div><strong id="kpiCountries">—</strong><span>Countries</span></div>
        <div><strong id="kpiMapped">—</strong><span>Mapped Locations</span></div>
      </section>
      <aside id="detailsPanel" class="details-panel" aria-live="polite" hidden>
        <button id="closeDetails" type="button" aria-label="Close facility details">×</button>
        <p id="detailVertical" class="eyebrow"></p>
        <h2 id="detailName"></h2>
        <dl id="detailList"></dl>
        <a id="detailSource" target="_blank" rel="noopener noreferrer">Open source</a>
      </aside>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
